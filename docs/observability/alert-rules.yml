groups:
  - name: celery-outbox
    rules:
      - alert: CeleryOutboxNewDeadLetters
        expr: increase(celery_outbox_messages_exceeded_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "New dead-lettered messages detected"
          description: "{{ $value }} messages exceeded max retries in the last 10 minutes"

      - alert: CeleryOutboxQueueBacklog
        expr: celery_outbox_queue_depth > 5000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Outbox queue depth > 5000"
          description: "Queue depth is {{ $value }}, relay may be stalled"

      - alert: CeleryOutboxHighFailureRate
        expr: |
          rate(celery_outbox_messages_failed_total[5m])
          / rate(celery_outbox_messages_published_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Message failure rate > 5%"
          description: "Failure rate is {{ $value | humanizePercentage }}"

      - alert: CeleryOutboxQueueAgeHigh
        expr: celery_outbox_oldest_pending_age_seconds > 60
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Outbox queue age above SLO"
          description: "Oldest live-backlog message is {{ $value | humanizeDuration }} old"
