name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  artifact_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Build sdist and wheel
        run: python -m build
      - name: Check built artifact contents
        run: pytest tests/release_artifact_tests.py -v
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Install built wheel
        run: |
          pip uninstall -y django-celery-outbox
          pip install --force-reinstall dist/*.whl
      - name: Smoke installed wheel
        run: |
          cd /tmp
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import django_celery_outbox
          import django_celery_outbox.management.commands.celery_outbox_purge_dead_letter
          import django_celery_outbox.management.commands.celery_outbox_relay
          import django_celery_outbox.management.commands.celery_outbox_stats

          data = json.loads(metadata.distribution('django-celery-outbox').read_text('direct_url.json'))
          assert data['url'].endswith('.whl'), data
          print(django_celery_outbox.__file__)
          PY

  release_contract:
    runs-on: ubuntu-latest
    needs: [artifact_smoke]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Check changelog release contract
        run: python scripts/check_release_contract.py CHANGELOG.md

  build-and-publish:
    needs: [release_contract]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-celery-outbox
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade pip and install build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
