name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  artifact_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Clean build outputs
        run: rm -rf build dist
      - name: Build sdist and wheel
        run: python -m build
      - name: Check built artifact contents
        run: pytest tests/release_artifact_tests.py -v
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Install built wheel
        run: |
          pip uninstall -y django-celery-outbox
          pip install --force-reinstall dist/*.whl
      - name: Smoke installed wheel
        run: |
          cd /tmp
          python "${GITHUB_WORKSPACE}/scripts/smoke_installed_wheel.py" --expect-wheel-origin
      - name: Upload smoke-tested artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-smoke-dist
          path: dist/*
          if-no-files-found: error

  live_broker_smoke:
    name: Live Broker Smoke (Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            django: "5.0"
          - python-version: "3.12"
            django: "5.1"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with test dependencies
        run: pip install -e '.[test]'
      - name: Install Django and Celery versions under test
        run: pip install "Django~=${{ matrix.django }}" "celery~=5.6"
      - name: Run live broker smoke tests
        env:
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: 5432
          CELERY_BROKER_URL: amqp://test:test@127.0.0.1:5672//
        run: pytest tests/live_broker_smoke_tests.py -v

  release_contract:
    runs-on: ubuntu-latest
    needs: [artifact_smoke, live_broker_smoke]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Check changelog release contract
        run: python scripts/check_release_contract.py --version "${GITHUB_REF_NAME#v}" CHANGELOG.md

  build-and-publish:
    needs: [release_contract]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-celery-outbox
    permissions:
      id-token: write
    steps:
      - name: Download smoke-tested artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: artifact-smoke-dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
