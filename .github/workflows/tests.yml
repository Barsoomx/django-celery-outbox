name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,test]'
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0

  lint:
    name: Code Quality (Ruff, Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev and test dependencies
        run: pip install -e '.[dev,test]'
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy -p django_celery_outbox --config-file=pyproject.toml

  test:
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django }} - ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        django: ['4.2', '5.0', '5.1', '5.2']
        db: ['postgresql', 'mysql']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test dependencies
        run: pip install -e '.[test]'

      - name: Install Django version
        run: pip install "Django~=${{ matrix.django }}"

      - name: Run tests
        env:
          DB_ENGINE: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: ${{ matrix.db == 'mysql' && 'root' || 'test' }}
          DB_PASSWORD: ${{ matrix.db == 'mysql' && 'root' || 'test' }}
          DB_PORT: ${{ matrix.db == 'postgresql' && '5432' || '3306' }}
        run: pytest -v
