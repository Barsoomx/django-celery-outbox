name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Install dependencies
        run: pip install -e '.[dev,test]'
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266

  lint:
    name: Code Quality (Ruff, Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Install package with dev and test dependencies
        run: pip install -e '.[dev,test]'
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy -p django_celery_outbox --config-file=pyproject.toml

  test:
    name: Py${{ matrix.python-version }} Dj${{ matrix.django }} Cel${{ matrix.celery }} ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        django: ['4.2', '5.2']
        celery: ['5.3', '5.4', '5.5', '5.6']
        db: ['postgresql']
        include:
          - python-version: '3.10'
            django: '4.2'
            celery: '5.6'
            db: 'mysql'
          - python-version: '3.11'
            django: '4.2'
            celery: '5.6'
            db: 'mysql'
          - python-version: '3.12'
            django: '4.2'
            celery: '5.6'
            db: 'mysql'
          - python-version: '3.10'
            django: '5.2'
            celery: '5.6'
            db: 'mysql'
          - python-version: '3.11'
            django: '5.2'
            celery: '5.6'
            db: 'mysql'
          - python-version: '3.12'
            django: '5.2'
            celery: '5.6'
            db: 'mysql'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test dependencies
        run: pip install -e '.[test]'

      - name: Install Django version
        run: pip install "Django~=${{ matrix.django }}"

      - name: Install Celery version
        run: pip install "celery~=${{ matrix.celery }}"

      - name: Run tests
        env:
          DB_ENGINE: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: ${{ matrix.db == 'mysql' && 'root' || 'test' }}
          DB_PASSWORD: ${{ matrix.db == 'mysql' && 'root' || 'test' }}
          DB_PORT: ${{ matrix.db == 'postgresql' && '5432' || '3306' }}
        run: pytest -m "not release_artifact and not live_broker_smoke" -v

  live_broker_smoke:
    name: Live Broker Smoke (Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            django: '5.0'
          - python-version: '3.12'
            django: '5.1'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test dependencies
        run: pip install -e '.[test]'

      - name: Install Django and Celery versions under test
        run: pip install "Django~=${{ matrix.django }}" "celery~=5.6"
      - name: Run Django compatibility smoke tests
        env:
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: 5432
        run: >
          pytest
          django_celery_outbox/admin_tests.py
          django_celery_outbox/app_tests.py
          django_celery_outbox/checks_tests.py
          django_celery_outbox/replay_tests.py
          django_celery_outbox/signals_tests.py
          tests/relay_tests.py
          -v

      - name: Run live broker smoke tests
        env:
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: 5432
          CELERY_BROKER_URL: amqp://test:test@127.0.0.1:5672//
        run: pytest tests/live_broker_smoke_tests.py -v

  parallel_broker_smoke:
    name: Parallel Broker Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test dependencies
        run: pip install -e '.[test]'

      - name: Install Django and Celery versions under test
        run: pip install "Django~=5.2" "celery~=5.6"

      - name: Run parallel broker smoke tests
        env:
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: 5432
          CELERY_BROKER_URL: amqp://test:test@127.0.0.1:5672//
        run: pytest tests/parallel_broker_smoke_tests.py -v

  bleeding-edge:
    name: Bleeding Edge (latest Django + Celery)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with test dependencies
        run: pip install -e '.[test]'
      - name: Install latest Django and Celery
        run: pip install --upgrade Django celery
      - name: Run tests
        env:
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: 5432
        run: pytest -m "not release_artifact and not live_broker_smoke" -v
